[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertainty"
version = "0.1.0"
description = "Programas de mediciones y cálculo de incertidumbre"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pyvisa",
]
[project.optional-dependencies]
dev = ["ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "uncert_lib*",
    "inst_virtual_lib*",
]